[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-application-specification"
version = "0.0.0.dev0"
description = "Load and query planning application specifications from local source files"
requires-python = ">=3.10"
dependencies = ["python-frontmatter>=1.1,<2"]

[tool.setuptools]
packages = ["planning_application_specification"]
include-package-data = false
