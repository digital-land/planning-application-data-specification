name: Render static specification site

on:
  workflow_dispatch:
  push:
    paths:
      - 'specification/**'
      - 'bin/inject_viewer_redirects.py'
      - '.github/workflows/render-static-site.yml'

jobs:
  render-static-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: make init
      
      - name: Set up environment variables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GITHUB_TOKEN=$GITHUB_TOKEN" > .env

      # Preserve every established URL, including pages removed from the current model.
      - name: Add redirects to existing site pages
        run: python3 -m bin.inject_viewer_redirects --output docs

      - name: Commit and push generated site
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs
          git diff --quiet && git diff --staged --quiet || git commit -m "Add viewer redirects [skip ci]"
          git push
