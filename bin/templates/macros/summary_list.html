{% macro summary_list_row(label, value) %}
<div class="govuk-summary-list__row">
  <dt class="govuk-summary-list__key">{{ label }}</dt>
  <dd class="govuk-summary-list__value"><code>{{ value }}</code></dd>
</div>
{% endmacro %}

{% macro summary_list_link_row(label, text, href) %}
<div class="govuk-summary-list__row">
  <dt class="govuk-summary-list__key">{{ label }}</dt>
  <dd class="govuk-summary-list__value"><a class="govuk-link" href="{{ href }}">{{ text }}</a></dd>
</div>
{% endmacro %}
