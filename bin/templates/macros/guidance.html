{% macro guidance_details(guidance) %}
{% if guidance %}
<details class="govuk-details govuk-!-margin-top-2 govuk-!-margin-bottom-2 govuk-!-padding-bottom-2 app-guidance-details">
  <summary class="govuk-details__summary">
    <span class="govuk-details__summary-text">Guidance</span>
  </summary>
  <div class="govuk-details__text">
    {{ guidance | safe }}
  </div>
</details>
{% endif %}
{% endmacro %}
